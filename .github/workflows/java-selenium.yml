name: Selenium Tests with Allure

on:
  push:
    branches: [swag_labs]
  pull_request:
    branches: [swag_labs]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Choose which test suite to run'
        type: choice
        options:
          - all
          - smoke
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      # 3️⃣ Install Maven
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      # 4️⃣ Build project without running tests
      - name: Build project
        run: mvn clean install -DskipTests

      # 5️⃣ Run tests
      - name: Run tests
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.test_suite }}" == "smoke" ]]; then
              mvn test -Dgroups=smoke
            else
              mvn test
            fi
          else
            mvn test
          fi

      # 6️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: |
          sudo apt update
          sudo apt install -y wget unzip
          wget https://github.com/allure-framework/allure2/releases/download/2.26.0/allure-2.26.0.zip
          unzip allure-2.26.0.zip -d $HOME/allure
          echo "$HOME/allure/allure-2.26.0/bin" >> $GITHUB_PATH

      # 7️⃣ Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate target/allure-results --clean -o allure-report

      # 8️⃣ Upload Allure Report as artifact
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      # 9️⃣ Upload Surefire test reports as artifact (optional)
      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
